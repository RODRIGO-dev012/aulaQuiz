name: Validar y publicar AulaQuiz
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Publicar solo el contenido autorizado del manifiesto
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1 --testTimeout=30000
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - run: npm run test:e2e:real -- --workers=1
      - run: npm run verify:production
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AULAQUIZ_PAGES_APPROVED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm_publication) ||
       (github.event_name == 'push' && vars.AULAQUIZ_AUTO_DEPLOY == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publicar contenido autorizado
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
